<svg xmlns="http://www.w3.org/2000/svg" width="146" height="28" viewBox="0 0 146 28" role="img" aria-label="$ contact --all">
  <title>$ contact --all</title>
  <style>
    /* One fixed (dark) palette on purpose. In an img-embedded SVG each image
       resolves prefers-color-scheme in its own isolated context, so the GitHub
       iOS app rendered some chips light and others dark on the same page. */
    .chip{fill:#21262d} .edge{stroke:#30363d} .cmd{fill:#e6edf3} .sig{fill:#9bcb5a}
  </style>
  <rect class="chip" x="0.5" y="0.5" width="144.5" height="27" rx="8"/>
  <rect class="edge" x="0.5" y="0.5" width="144.5" height="27" rx="8" fill="none"/>
  <text x="12" y="18.9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" class="sig">$</text>
  <text x="28.2" y="18.9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" class="cmd" textLength="105.3" lengthAdjust="spacingAndGlyphs">contact --all</text>
</svg>
